<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFam promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Fredoka:wght@500;700&family=Fraunces:ital,wght@0,600;1,500&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; color: #3b2a20;
        font-family: 'Gowun Dodum', 'Malgun Gothic', 'Segoe UI Emoji', sans-serif; }
  .en #ui { font-family: 'Fredoka', 'Segoe UI', 'Segoe UI Emoji', sans-serif; font-weight: 500; }
  .serif { font-family: 'Gowun Batang', 'Batang', serif; }
  .en .serif { font-family: 'Fraunces', Georgia, serif; }
  #ui > div { position: absolute; visibility: hidden; }

  .title { left: 50%; top: 58px; display: flex; align-items: center; gap: 26px; }
  .title img { width: 128px; height: 128px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .title .name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 132px; color: #fff; letter-spacing: -2px;
                 text-shadow: 0 6px 30px rgba(120,150,255,.45); }
  .tagline { left: 50%; bottom: 70px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 54px; color: #fff8ec; white-space: nowrap;
             text-shadow: 0 3px 18px rgba(60,30,40,.55); }
  .en .tagline { font-family: 'Fraunces', serif; font-weight: 600; }

  .shade { left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(to top, rgba(40,26,20,.55), rgba(40,26,20,0)); }
  .cap { left: 104px; bottom: 84px; max-width: 1500px; }
  .cap .kicker { display: flex; align-items: center; gap: 18px; font-family: 'Gowun Batang', serif; font-weight: 700; color: #ffe9c4;
                 font-size: 32px; letter-spacing: .14em; text-shadow: 0 2px 10px rgba(40,20,10,.6); }
  .cap .kicker::before { content: ''; width: 56px; height: 2px; background: #ffe9c4; }
  .cap .line { margin-top: 14px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 70px; color: #fffaf0; line-height: 1.2;
               text-shadow: 0 3px 4px rgba(50,28,16,.45), 0 4px 26px rgba(30,16,10,.55); }
  .en .cap .kicker { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; letter-spacing: .06em; }
  .en .cap .line { font-family: 'Fraunces', serif; font-weight: 600; font-size: 62px; }

  .tag { padding: 10px 22px; border-radius: 16px; background: rgba(255,250,240,.95); border: 2px solid #4b3326; font-size: 34px; white-space: nowrap;
         box-shadow: 0 8px 22px rgba(0,0,0,.3); }
  .chip { width: 0; height: 0; }
  .chip .ring { position: absolute; left: -34px; top: -34px; width: 60px; height: 60px; border-radius: 50%;
                border: 4px solid #fff; box-shadow: 0 0 0 4px rgba(80,200,255,.6), 0 0 22px rgba(80,200,255,.8); }
  .chip .label { position: absolute; left: 0; top: -58px; transform: translate(-50%, -100%); padding: 8px 20px; border-radius: 999px;
                 background: rgba(255,250,240,.95); border: 2px solid #4b3326; font-size: 32px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  .note { left: 50%; top: 56px; padding: 16px 32px; border-radius: 999px; background: rgba(255,250,240,.95); border: 2px solid #4b3326; font-size: 36px;
          white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

  .bubble { padding: 14px 30px; border-radius: 34px; background: #fffaf0; border: 3px solid #4b3326; font-size: 40px; white-space: nowrap;
            transform-origin: 50% 120%; box-shadow: 0 8px 20px rgba(40,24,10,.22); }
  .bubble::before { content: ''; position: absolute; left: 50%; bottom: -26px; margin-left: -17px; border: 17px solid transparent;
                    border-top: 24px solid #4b3326; border-bottom: 0; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -19px; margin-left: -13px; border: 13px solid transparent;
                   border-top: 19px solid #fffaf0; border-bottom: 0; }

  .card { left: 1080px; top: 84px; width: 740px; padding: 26px 30px 24px; border-radius: 26px; background: rgba(255,250,240,.97); border: 3px solid #4b3326;
          box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .card .ctitle { font-size: 34px; margin-bottom: 18px; }
  .card .crow { display: flex; gap: 14px; align-items: stretch; }
  .card .cinput { flex: 1; min-height: 64px; padding: 12px 18px; box-sizing: border-box; border-radius: 14px; border: 3px solid #8b7bf5;
                  background: #fff; font-size: 32px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .card .caret { display: inline-block; width: 3px; height: 36px; margin-left: 3px; background: #3a2a24; }
  .card .cbtn { padding: 0 24px; border-radius: 14px; background: #eee6ff; font-size: 30px; display: flex; align-items: center;
                white-space: nowrap; transition: none; }
  .card .cbtn.down { transform: scale(.92); background: #d9ccff; }
  .card .cstatus { margin-top: 14px; min-height: 36px; font-size: 28px; color: #6b7280; }

  .counter { padding: 10px 26px; border-radius: 999px; background: #fffaf0; border: 3px solid #4b3326; font-size: 38px; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .counter, .counter * { font-family: 'Fredoka', 'Jua', sans-serif; }
  .ko .counter { font-family: 'Gowun Dodum', sans-serif; }

  .end { left: 50%; top: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .end img { width: 190px; height: 190px; filter: drop-shadow(0 12px 26px rgba(40,60,100,.3)); }
  .end .name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 150px; line-height: 1.05; color: #fffaf0; letter-spacing: -2px;
               text-shadow: 0 4px 0 #4b3326, 0 10px 30px rgba(40,60,100,.35); }
  .end .sub { margin-top: 14px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 54px; color: #3b4a66; white-space: nowrap; }
  .en .end .sub { font-family: 'Fraunces', serif; font-weight: 600; }
  .end .pills { margin-top: 30px; display: flex; gap: 16px; }
  .end .pills span { padding: 10px 28px; border-radius: 999px; background: rgba(255,250,240,.85); border: 2px solid #4b3326;
                     font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 34px; color: #4b3326; }
  .fade { inset: 0; background: #000; visibility: visible !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="ui"></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
