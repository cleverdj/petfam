<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFam promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; color: #3a2a24;
        font-family: 'Jua', 'Fredoka', 'Malgun Gothic', 'Segoe UI Emoji', sans-serif; }
  .en #ui { font-family: 'Fredoka', 'Segoe UI', 'Segoe UI Emoji', sans-serif; font-weight: 500; }
  #ui > div { position: absolute; visibility: hidden; }

  .title { left: 50%; top: 58px; display: flex; align-items: center; gap: 26px; }
  .title img { width: 128px; height: 128px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .title .name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 132px; color: #fff; letter-spacing: -2px;
                 text-shadow: 0 6px 30px rgba(120,150,255,.45); }
  .tagline { left: 50%; bottom: 70px; font-size: 54px; color: #fff; white-space: nowrap; text-shadow: 0 4px 22px rgba(0,0,0,.5); }

  .shade { left: 0; right: 0; bottom: 0; height: 330px; background: linear-gradient(to top, rgba(18,14,30,.62), rgba(18,14,30,0)); }
  .cap { left: 96px; bottom: 82px; max-width: 1400px; }
  .cap .kicker { display: inline-block; padding: 10px 26px; border-radius: 999px; background: #ff8a5c; color: #fff; font-size: 34px;
                 box-shadow: 0 6px 18px rgba(255,120,80,.4); }
  .cap .line { margin-top: 16px; font-size: 72px; color: #fff; line-height: 1.15; text-shadow: 0 4px 24px rgba(0,0,0,.45); }
  .en .cap .line { font-weight: 700; font-size: 64px; }

  .tag { padding: 10px 22px; border-radius: 16px; background: rgba(255,255,255,.95); font-size: 34px; white-space: nowrap;
         box-shadow: 0 8px 22px rgba(0,0,0,.3); }
  .chip { width: 0; height: 0; }
  .chip .ring { position: absolute; left: -34px; top: -34px; width: 60px; height: 60px; border-radius: 50%;
                border: 4px solid #fff; box-shadow: 0 0 0 4px rgba(80,200,255,.6), 0 0 22px rgba(80,200,255,.8); }
  .chip .label { position: absolute; left: 0; top: -58px; transform: translate(-50%, -100%); padding: 8px 20px; border-radius: 999px;
                 background: rgba(255,255,255,.95); font-size: 32px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .note { left: 50%; top: 56px; padding: 16px 32px; border-radius: 999px; background: rgba(255,255,255,.94); font-size: 36px;
          white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

  .bubble { padding: 16px 30px; border-radius: 30px; background: #fff; font-size: 40px; white-space: nowrap; transform-origin: 50% 120%;
            box-shadow: 0 10px 26px rgba(0,0,0,.28); }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -20px; margin-left: -16px; border: 16px solid transparent;
                   border-top: 22px solid #fff; border-bottom: 0; }

  .card { left: 1080px; top: 84px; width: 740px; padding: 26px 30px 24px; border-radius: 26px; background: rgba(250,251,255,.97);
          box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .card .ctitle { font-size: 34px; margin-bottom: 18px; }
  .card .crow { display: flex; gap: 14px; align-items: stretch; }
  .card .cinput { flex: 1; min-height: 64px; padding: 12px 18px; box-sizing: border-box; border-radius: 14px; border: 3px solid #8b7bf5;
                  background: #fff; font-size: 32px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .card .caret { display: inline-block; width: 3px; height: 36px; margin-left: 3px; background: #3a2a24; }
  .card .cbtn { padding: 0 24px; border-radius: 14px; background: #eee6ff; font-size: 30px; display: flex; align-items: center;
                white-space: nowrap; transition: none; }
  .card .cbtn.down { transform: scale(.92); background: #d9ccff; }
  .card .cstatus { margin-top: 14px; min-height: 36px; font-size: 28px; color: #6b7280; }

  .counter { padding: 10px 26px; border-radius: 999px; background: #fff; font-size: 38px; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .counter, .counter * { font-family: 'Fredoka', 'Jua', sans-serif; }
  .ko .counter { font-family: 'Jua', sans-serif; }

  .end { left: 50%; top: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .end img { width: 190px; height: 190px; filter: drop-shadow(0 12px 26px rgba(150,80,40,.3)); }
  .end .name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 150px; line-height: 1.05; color: #4a2f27; letter-spacing: -2px; }
  .end .sub { margin-top: 8px; font-size: 56px; color: #6b4436; white-space: nowrap; }
  .end .pills { margin-top: 30px; display: flex; gap: 16px; }
  .end .pills span { padding: 10px 28px; border-radius: 999px; background: rgba(255,255,255,.75); font-family: 'Fredoka', sans-serif;
                     font-weight: 500; font-size: 34px; color: #6b4436; }
  .fade { inset: 0; background: #000; visibility: visible !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><div id="ui"></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
