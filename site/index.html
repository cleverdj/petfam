<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFam — 우리 펫 가족이 바탕화면에 살아요</title>
<meta name="description" content="PetFam is a desktop pet for Windows and macOS: a puppy or a kitten that lives on your wallpaper, behind your windows.">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<style>
  :root { --bg: #fff8ee; --ink: #1f1a17; --soft: #6f655d; --line: #3a2a22; --card: #ffffff; --coral: #ff6b4a; --butter: #ffd45c; --mint: #9be3c3; --sky: #8ec9ff; --lilac: #c9b6ff; --r: 32px; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
         font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(44px, 8.4vw, 124px); font-weight: 850; letter-spacing: -0.045em; line-height: 0.98; }
  h2 { font-size: clamp(32px, 5vw, 68px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; }
  h3 { font-size: clamp(22px, 2.2vw, 30px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
  .wrap { width: min(1240px, 100% - 40px); margin: 0 auto; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1.5px solid rgba(31,26,23,.12); font-size: 14px; font-weight: 600; }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #2fbf71; box-shadow: 0 0 0 4px rgba(47,191,113,.2); }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 28px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 17px; border: 0; cursor: pointer;
         transition: transform .2s cubic-bezier(.2,.9,.3,1.4), background .2s; font-family: inherit; }
  .btn:hover { transform: translateY(-3px) scale(1.03); }
  .btn.coral { background: var(--coral); } .btn.light { background: #fff; color: var(--ink); border: 1.5px solid rgba(31,26,23,.14); }
  .btn.sm { padding: 10px 18px; font-size: 15px; }

  nav { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; padding: 7px 7px 7px 16px; border-radius: 999px;
        background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(31,26,23,.1); box-shadow: 0 10px 40px rgba(60,40,20,.1); white-space: nowrap; }
  nav .brand { display: flex; align-items: center; gap: 8px; font-weight: 850; font-size: 18px; letter-spacing: -0.03em; margin-right: 10px; }
  nav .brand img { width: 28px; height: 28px; border-radius: 8px; }
  nav a.l { padding: 8px 13px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--soft); transition: background .2s, color .2s; }
  nav a.l:hover { background: rgba(31,26,23,.06); color: var(--ink); }
  #lang { padding: 8px 12px; border-radius: 999px; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--soft); }

  /* hero */
  .hero { position: relative; padding: clamp(120px, 17vh, 190px) 0 40px; text-align: center; overflow: hidden; }
  #glow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .9; }
  .hero::before { content: ''; position: absolute; inset: 0; z-index: 0; background: radial-gradient(60% 50% at 20% 20%, #ffe1c9, transparent 70%), radial-gradient(50% 45% at 85% 15%, #d9ecff, transparent 70%), radial-gradient(60% 50% at 60% 70%, #e3dcff, transparent 70%); }
  .hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(transparent, var(--bg)); z-index: 0; }
  .hero > .wrap { position: relative; z-index: 1; }
  .hero h1 em { font-style: normal; color: var(--coral); }
  .hero .sub { max-width: 620px; margin: 26px auto 30px; font-size: clamp(17px, 1.6vw, 21px); color: var(--soft); font-weight: 500; }
  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* the desktop demo */
  .desk { position: relative; margin: 56px auto 0; aspect-ratio: 16 / 9; max-height: 640px; border-radius: 28px; overflow: hidden; background: #8fc6ec url(assets/meadow.jpg) center / cover;
          box-shadow: 0 40px 100px rgba(60,40,20,.25), 0 0 0 8px #fff, 0 0 0 9.5px rgba(31,26,23,.12); touch-action: pan-y; }
  .desk .tip { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,.85); backdrop-filter: blur(8px); font-size: 14px; font-weight: 600; z-index: 6; }
  .actor { position: absolute; left: 0; bottom: 0; width: 13%; min-width: 74px; will-change: transform; z-index: 2; }
  .actor .flip { transition: transform .25s; }
  .win { position: absolute; z-index: 4; border-radius: 14px; background: #fff; box-shadow: 0 18px 50px rgba(30,20,10,.3); overflow: hidden; cursor: grab; user-select: none; touch-action: none; }
  .win:active { cursor: grabbing; }
  .win .bar { height: 30px; background: #f1ede7; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--soft); }
  .win .bar b { width: 10px; height: 10px; border-radius: 50%; background: #ff6159; } .win .bar b:nth-child(2) { background: #ffbd2e; } .win .bar b:nth-child(3) { background: #28c941; margin-right: 6px; }
  .win .body { padding: 14px; display: grid; gap: 9px; }
  .win .body span { height: 9px; border-radius: 5px; background: #e6e1da; display: block; }
  .win.dark { background: #1f2333; } .win.dark .bar { background: #2b3046; color: #c9d1e8; } .win.dark .body span { background: #7aa2f7; }
  .bubble { position: absolute; left: 50%; bottom: 96%; transform: translateX(-50%) scale(0); transform-origin: 50% 100%; padding: 7px 14px; border-radius: 16px; background: #fff; font-size: clamp(12px, 1.2vw, 15px); font-weight: 700;
            white-space: nowrap; box-shadow: 0 6px 18px rgba(30,20,10,.2); transition: transform .3s cubic-bezier(.2,.9,.3,1.5); }
  .bubble.on { transform: translateX(-50%) scale(1); }

  /* 2D pets */
  .pet { display: block; width: 100%; overflow: visible; }
  .pet * { stroke: var(--line); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  .pet .ns { stroke: none; }
  .pet .leg, .pet .tail, .pet .head, .pet .eye, .pet .ear { transform-box: fill-box; }
  .pet .leg { transform-origin: 50% 8%; }
  .pet.walk .l1, .pet.walk .l4 { animation: legA .46s linear infinite; }
  .pet.walk .l2, .pet.walk .l3 { animation: legB .46s linear infinite; }
  .pet.walk .bodyg { animation: trot .23s ease-in-out infinite alternate; }
  .pet .tail { transform-origin: 100% 100%; animation: wag .34s ease-in-out infinite alternate; }
  .pet.cat .tail { animation: sway 1.9s ease-in-out infinite alternate; }
  .pet .head { transform-origin: 30% 95%; animation: nod 2.6s ease-in-out infinite; }
  .pet .eye { transform-origin: 50% 50%; animation: blink 4.2s infinite; }
  .pet.cat .eye { animation-delay: 1.3s; }
  .pet .ear { transform-origin: 50% 0; animation: flop 2.6s ease-in-out infinite; }
  .pet .acc { display: none; }
  .pet.hat .hat, .pet.scarf .scarf, .pet.glasses .glasses, .pet.crown .crown { display: block; }
  .hop { animation: hop .5s cubic-bezier(.3,0,.5,1); }
  @keyframes legA { 0%,100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
  @keyframes legB { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(26deg); } }
  @keyframes trot { to { transform: translateY(-2.5px); } }
  @keyframes wag { from { transform: rotate(-16deg); } to { transform: rotate(22deg); } }
  @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(12deg); } }
  @keyframes nod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3.5deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes flop { 0%,100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-34%); } }

  /* marquee */
  .marquee { overflow: hidden; padding: 34px 0; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  .marquee div { display: flex; gap: 14px; width: max-content; animation: slide 46s linear infinite; }
  .marquee span { padding: 10px 20px; border-radius: 999px; background: #fff; border: 1.5px solid rgba(31,26,23,.1); font-weight: 700; font-size: 16px; white-space: nowrap; }
  .marquee span:nth-child(4n+1) { background: var(--butter); border-color: transparent; } .marquee span:nth-child(4n+3) { background: var(--mint); border-color: transparent; }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* bento */
  section { padding: clamp(60px, 9vw, 120px) 0; }
  .head { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 34px; }
  .head p { max-width: 420px; color: var(--soft); font-weight: 500; }
  .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .tile { position: relative; grid-column: span 2; min-height: 380px; border-radius: var(--r); padding: 28px; overflow: hidden; background: var(--card); border: 1.5px solid rgba(31,26,23,.08);
          display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .35s; }
  .tile:hover { transform: translateY(-6px); box-shadow: 0 24px 60px rgba(60,40,20,.14); }
  .tile.w3 { grid-column: span 3; } .tile.w4 { grid-column: span 4; } .tile.w6 { grid-column: span 6; min-height: 0; }
  .tile.w6 .art { position: absolute; right: 40px; bottom: 0; margin: 0; min-height: 0; }
  .tile.w6 p { max-width: 620px; }
  .tile p { color: var(--soft); margin-top: 8px; font-weight: 500; font-size: 16px; max-width: 440px; }
  .tile .tag { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 10px; }
  .tile .art { position: relative; flex: 1; min-height: 190px; margin: 18px -28px -28px; }
  .t-sky { background: linear-gradient(160deg, #dff0ff, #b9dcff); } .t-butter { background: linear-gradient(160deg, #fff1c2, #ffd98a); } .t-mint { background: linear-gradient(160deg, #dcf7ea, #b4ebd2); }
  .t-lilac { background: linear-gradient(160deg, #ece5ff, #d2c4ff); } .t-coral { background: linear-gradient(160deg, #ffe0d6, #ffbfae); } .t-ink { background: #1f1a17; color: #fff; } .t-ink p { color: #b9aea4; }
  .art .pet { position: absolute; width: 150px; }
  /* peek */
  .peek .w { position: absolute; left: 12%; right: 12%; bottom: -30px; height: 62%; border-radius: 16px 16px 0 0; background: #fff; box-shadow: 0 -10px 40px rgba(30,60,120,.18); z-index: 2; }
  .peek .w::before { content: ''; position: absolute; left: 16px; top: 14px; width: 46px; height: 10px; border-radius: 5px; background: radial-gradient(circle at 5px 5px, #ff6159 4.5px, transparent 5px), radial-gradient(circle at 23px 5px, #ffbd2e 4.5px, transparent 5px), radial-gradient(circle at 41px 5px, #28c941 4.5px, transparent 5px); }
  .peek .pet { left: 50%; margin-left: -75px; bottom: 44%; animation: peek 5.5s cubic-bezier(.4,0,.2,1) infinite; z-index: 1; }
  @keyframes peek { 0%, 12%, 88%, 100% { transform: translateY(74%); } 28%, 72% { transform: translateY(0); } }
  /* chat */
  .chat { display: flex; flex-direction: column; gap: 10px; padding: 0 28px 28px; justify-content: flex-end; }
  .chat div { max-width: 82%; padding: 11px 16px; border-radius: 20px; background: #fff; font-weight: 600; font-size: 15px; opacity: 0; animation: say 9s infinite; box-shadow: 0 4px 14px rgba(60,40,120,.1); }
  .chat div:nth-child(even) { align-self: flex-end; background: var(--ink); color: #fff; }
  .chat div:nth-child(2) { animation-delay: 1.4s; } .chat div:nth-child(3) { animation-delay: 2.8s; } .chat div:nth-child(4) { animation-delay: 4.2s; }
  @keyframes say { 0% { opacity: 0; transform: translateY(14px) scale(.9); } 5%, 78% { opacity: 1; transform: none; } 86%, 100% { opacity: 0; transform: translateY(-6px); } }
  /* house */
  .prompt { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding: 11px 16px; border-radius: 16px; background: rgba(255,255,255,.8); font-weight: 600; font-size: 15px; min-height: 46px; }
  .prompt::after { content: ''; width: 2px; height: 18px; background: var(--ink); animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .hut { position: absolute; left: 50%; bottom: 14px; width: 200px; margin-left: -100px; transform-origin: 50% 100%; transform: scale(0); transition: transform .6s cubic-bezier(.2,.9,.3,1.5); }
  .hut.on { transform: scale(1); }
  /* weather */
  .chips { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .chips button { padding: 9px 16px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.25); background: transparent; color: inherit; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; transition: background .2s, color .2s; }
  .chips button.on { background: #fff; color: var(--ink); border-color: #fff; }
  .wx { border-radius: 24px 24px 0 0; margin: 18px 0 -28px; background: linear-gradient(#7fc4ff, #c8f0c0); transition: background .6s; overflow: hidden; }
  .wx[data-w=rain] { background: linear-gradient(#4a5878, #6f8f7a); } .wx[data-w=snow] { background: linear-gradient(#8fa3c0, #eef3f8); }
  .wx::before { content: ''; position: absolute; inset: -40px; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 3; }
  .wx[data-w=rain]::before { opacity: .7; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255,255,255,.75) 22px 23.5px, transparent 23.5px 46px); background-size: 46px 40px; animation: rain .35s linear infinite; }
  .wx[data-w=snow]::before { opacity: 1; background: radial-gradient(circle, #fff 2.6px, transparent 3px) 0 0 / 46px 46px, radial-gradient(circle, #fff 1.8px, transparent 2.2px) 23px 18px / 34px 34px; animation: snow 5s linear infinite; }
  @keyframes rain { to { background-position: -8px 40px; } } @keyframes snow { to { background-position: 14px 46px, 37px 52px; } }
  .wx .sun { position: absolute; right: 26px; top: 22px; width: 54px; height: 54px; border-radius: 50%; background: #ffe27a; box-shadow: 0 0 0 10px rgba(255,226,122,.35); transition: transform .6s, opacity .6s; }
  .wx:not([data-w=sun]) .sun { transform: translateY(-90px); opacity: 0; }
  .wx .pet { left: 50%; margin-left: -75px; bottom: 6px; }
  /* grow */
  .grow .art { display: flex; align-items: flex-end; justify-content: center; }
  .grow .pet { position: static; width: 190px; transform-origin: 50% 100%; transition: transform .3s cubic-bezier(.2,.9,.3,1.4); margin-bottom: 8px; }
  .grow .row { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .grow output { font-weight: 850; font-size: 28px; letter-spacing: -0.03em; min-width: 190px; }
  input[type=range] { flex: 1; accent-color: var(--ink); height: 28px; }
  /* dress */
  .dress .art { display: flex; align-items: flex-end; justify-content: center; }
  .dress .pet { position: static; width: 190px; margin-bottom: 8px; }
  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
  .stats div { border-radius: var(--r); padding: 26px 28px; background: #fff; border: 1.5px solid rgba(31,26,23,.08); }
  .stats b { display: block; font-size: clamp(40px, 5vw, 68px); font-weight: 850; letter-spacing: -0.05em; line-height: 1; }
  .stats span { color: var(--soft); font-weight: 600; font-size: 15px; }
  /* film + download */
  .film { border-radius: clamp(24px, 4vw, 48px); background: #1f1a17; color: #fff; padding: clamp(24px, 5vw, 64px); }
  .film .head p { color: #b9aea4; }
  .film video { width: 100%; border-radius: 24px; display: block; background: #000; }
  .get { position: relative; text-align: center; border-radius: clamp(24px, 4vw, 48px); padding: clamp(110px, 12vw, 150px) 24px clamp(48px, 7vw, 90px); background: linear-gradient(135deg, #ffd45c, #ff9d6b 55%, #ff6b4a); overflow: hidden; }
  .get h2 { font-size: clamp(38px, 6.4vw, 92px); }
  .get p { margin: 16px auto 28px; max-width: 520px; font-weight: 600; opacity: .8; }
  .get .note { font-size: 14px; margin: 22px auto 0; opacity: .7; }
  .get .row { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: clamp(0px, 2vw, 26px); }
  .get .row .pet { position: static; width: clamp(64px, 9vw, 112px); }
  footer { padding: 34px 0 44px; text-align: center; color: var(--soft); font-size: 14px; font-weight: 500; }

  .reveal { opacity: 0; transform: translateY(34px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  @media (max-width: 900px) { .tile, .tile.w3, .tile.w4, .tile.w6 { grid-column: span 6; min-height: 340px; } .tile.w6 .art { position: relative; right: 0; margin: 18px -28px -28px; } .stats { grid-template-columns: repeat(2, 1fr); } nav a.l, .desk .tip { display: none; } .win { transform: scale(.72); transform-origin: 0 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<nav>
  <a class="brand" href="#top"><img src="assets/icon.png" alt="">PetFam</a>
  <a class="l" href="#features" data-ko="기능" data-en="Features"></a>
  <a class="l" href="#film" data-ko="영상" data-en="Film"></a>
  <button id="lang" type="button">EN</button>
  <a class="btn sm coral" href="#download" data-ko="받기" data-en="Download"></a>
</nav>

<main id="top">
  <header class="hero">
    <canvas id="glow" aria-hidden="true"></canvas>
    <div class="wrap">
      <span class="eyebrow"><i></i><span data-ko="v1.0 · Windows & macOS · 무료" data-en="v1.0 · Windows & macOS · Free"></span></span>
      <h1 style="margin-top:22px" data-ko="바탕화면에 사는<br><em>우리 펫 가족</em>" data-en="Your pet family,<br><em>living on your desktop</em>"></h1>
      <p class="sub" data-ko="강아지나 고양이를 입양하면 내 창 뒤, 바탕화면 위로 이사 와요. 풍경을 집 삼아 걷고, 낮잠 자고, 하루하루 함께 자라요."
         data-en="Adopt a puppy or a kitten and it moves in behind your windows. It walks on your wallpaper, naps in its little house and grows up with you."></p>
      <div class="cta">
        <a class="btn coral" href="#download" data-ko="무료로 받기 ↓" data-en="Get it free ↓"></a>
        <a class="btn light" href="#film" data-ko="▶ 단편 영상 보기" data-en="▶ Watch the film"></a>
      </div>
      <div class="desk reveal" id="desk">
        <div class="tip" data-ko="창을 끌어 보세요 · 고양이는 마우스를 따라와요 · 펫을 누르면 폴짝" data-en="Drag the windows · the cat follows your mouse · click a pet for a hop"></div>
        <div class="win" style="left:6%; top:34%; width:34%"><div class="bar"><b></b><b></b><b></b>Weekly report</div><div class="body"><span style="width:60%;background:#1f1a17"></span><span></span><span style="width:85%"></span><span style="width:70%"></span><span style="width:90%"></span><span style="width:40%"></span></div></div>
        <div class="win dark" style="right:7%; top:14%; width:30%"><div class="bar"><b></b><b></b><b></b>main.cs</div><div class="body"><span style="width:50%;background:#bb9af7"></span><span style="width:75%;margin-left:14px"></span><span style="width:60%;margin-left:28px;background:#9ece6a"></span><span style="width:70%;margin-left:28px;background:#e0af68"></span><span style="width:40%;margin-left:14px"></span></div></div>
      </div>
    </div>
  </header>

  <div class="marquee" aria-hidden="true"><div id="breeds"></div></div>

  <section id="features">
    <div class="wrap">
      <div class="head reveal">
        <h2 data-ko="작지만<br>진짜 같은 삶" data-en="A small life<br>that feels real"></h2>
        <p data-ko="화면 보호기가 아니에요. 펫은 모든 창 아래, 바탕화면 층에 살고 손을 내밀 때만 앞으로 나와요." data-en="Not a screensaver. Pets live on the desktop layer, under every window, and come forward only when you reach for them."></p>
      </div>
      <div class="bento">
        <article class="tile w4 t-sky peek reveal">

<script type="module">
// ------------------------------------------------------------------------------------------ 2D pets (SVG)

  cat: { kind: 'cat', coat: '#9aa5b6', far: '#818da0', belly: '#f6f3ee' },

  const earsFront = up ? `<path class="ear" d="M70 26 74 6l15 15z" fill="${c}"/><path class="ns" d="M75 22 76.5 13l7 7z" fill="#f4a7b4"/>` : `<ellipse class="ear" cx="69" cy="42" rx="7.5" ry="14" fill="${o.ear}" transform="rotate(14 69 42)"/>`;
  return `<svg class="pet ${o.kind} ${cls}" style="${style}" viewBox="0 -8 124 104" role="img" aria-label="${name}">
    ${tail}${leg('l2', 31, o.far)}${leg('l4', 65, o.far)}
    <g class="bodyg"><ellipse cx="52" cy="58" rx="30" ry="19" fill="${c}"/><ellipse class="ns" cx="58" cy="67" rx="17" ry="8" fill="${b}"/>
    <g class="acc scarf"><path d="M70 50q12 9 26 2l2 8q-15 8 -30 -1z" fill="#e2574c"/><path d="M76 58l-3 15 8 1 3 -14z" fill="#e2574c"/></g></g>
    ${leg('l1', 38, c)}${leg('l3', 71, c)}
    <g class="head">${earsBack}<circle cx="86" cy="38" r="20" fill="${c}"/>${o.mask ? `<path class="ns" d="M72 40q14 -16 28 0q-2 16 -14 17q-12 -1 -14 -17z" fill="${b}"/>` : ''}${earsFront}
      <ellipse cx="88" cy="45" rx="${cat ? 7.5 : 9.5}" ry="${cat ? 5.5 : 7}" fill="${b}"/>
      <ellipse cx="88" cy="41.5" rx="${cat ? 2.2 : 3.4}" ry="${cat ? 1.7 : 2.5}" fill="${cat ? '#e98a9a' : LINE}" style="stroke-width:1"/>
      <path d="M88 44q-3 4 -6 2M88 44q3 4 6 2" fill="none" style="stroke-width:1.8"/>
      <ellipse class="eye ns" cx="79" cy="35" rx="2.9" ry="3.4" fill="${LINE}"/><ellipse class="eye ns" cx="96" cy="35" rx="2.9" ry="3.4" fill="${LINE}"/>
      <circle class="ns" cx="80" cy="33.8" r="1" fill="#fff"/><circle class="ns" cx="97" cy="33.8" r="1" fill="#fff"/>
      <ellipse class="ns" cx="73" cy="43" rx="4" ry="2.5" fill="#ff8fa3" opacity=".6"/><ellipse class="ns" cx="102" cy="43" rx="4" ry="2.5" fill="#ff8fa3" opacity=".6"/>
      <g class="acc hat"><path d="M76 21 87 -5l10 26z" fill="#ff6b8b"/><path class="ns" d="M80.5 12h12.5l1.5 4h-15.5z" fill="#ffd45c"/><circle cx="87" cy="-5" r="3.5" fill="#8ec9ff"/></g>
      <g class="acc crown"><path d="M73 22 71 6l8 7 7 -11 7 11 8 -7 -2 16z" fill="#ffd45c"/></g>
      <g class="acc glasses"><circle cx="79" cy="35" r="6.5" fill="rgba(255,255,255,.35)"/><circle cx="96" cy="35" r="6.5" fill="rgba(255,255,255,.35)"/><path d="M85.5 35h4" fill="none"/></g>
    </g></svg>`;
}
document.querySelectorAll('[data-pet]').forEach(el => { el.outerHTML = petSVG(el.dataset.pet, el.dataset.class ?? '', el.getAttribute('style') ?? ''); });
document.getElementById('lineup').innerHTML = ['corgi', 'cat', 'husky', 'kitten', 'dog', 'black', 'shiba'].map(n => petSVG(n)).join('');

// ------------------------------------------------------------------------------------------ language
const root = document.documentElement;
const BREEDS = { ko: ['포메라니안', '말티즈', '토이 푸들', '비숑', '시바견', '웰시코기', '진돗개', '골든 리트리버', '프렌치 불도그', '닥스훈트', '허스키', '치와와', '비글', '사모예드', '보더 콜리', '시추', '퍼그', '코리안 숏헤어', '러시안 블루', '브리티시 숏헤어', '스코티시 폴드', '페르시안', '랙돌', '먼치킨', '샴', '메인쿤', '벵골', '스핑크스', '아비시니안', '노르웨이 숲', '터키시 앙고라'],
  en: ['Pomeranian', 'Maltese', 'Toy Poodle', 'Bichon Frisé', 'Shiba Inu', 'Welsh Corgi', 'Jindo', 'Golden Retriever', 'French Bulldog', 'Dachshund', 'Husky', 'Chihuahua', 'Beagle', 'Samoyed', 'Border Collie', 'Shih Tzu', 'Pug', 'Korean Shorthair', 'Russian Blue', 'British Shorthair', 'Scottish Fold', 'Persian', 'Ragdoll', 'Munchkin', 'Siamese', 'Maine Coon', 'Bengal', 'Sphynx', 'Abyssinian', 'Norwegian Forest', 'Turkish Angora'] };
const T = (ko, en) => (root.lang === 'ko' ? ko : en);
const days = document.getElementById('days'), age = document.getElementById('age'), growPet = document.querySelector('.grow .pet');
function showAge() {
  const d = +days.value, stage = d < 15 ? T('아기', 'Baby') : d < 46 ? T('청소년', 'Junior') : d < 366 ? T('어른', 'Adult') : T('어르신', 'Senior');
  age.textContent = `D+${d} · ${stage}`;
  growPet.style.transform = `scale(${(0.5 + 0.5 * Math.min(1, d / 120)).toFixed(3)})`;
}
days.oninput = showAge;
function setLang(l) {
  root.lang = l;
  document.querySelectorAll('[data-ko]').forEach(e => { e.innerHTML = e.dataset[l]; });
  document.getElementById('lang').textContent = l === 'ko' ? 'EN' : '한국어';
  document.title = T('PetFam — 우리 펫 가족이 바탕화면에 살아요', 'PetFam — Your pet family, living on your desktop');
  document.getElementById('breeds').innerHTML = [...BREEDS[l], ...BREEDS[l]].map(b => `<span>${b}</span>`).join('');
  showAge();
  try { localStorage.setItem('petfam-lang', l); } catch { /* private mode */ }
}
document.getElementById('lang').onclick = () => setLang(root.lang === 'ko' ? 'en' : 'ko');
let saved = null; try { saved = localStorage.getItem('petfam-lang'); } catch { /* private mode */ }
setLang(saved ?? ((navigator.language || 'en').startsWith('ko') ? 'ko' : 'en'));

// ------------------------------------------------------------------------------------------ bento widgets
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(e => io.observe(e));

// House from a sentence: type, build, pause, repeat.
const typed = document.getElementById('typed'), hut = document.getElementById('hut');
(async function house() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  for (;;) {
    const text = T('등불 달린 아늑한 통나무집', 'A cozy log cabin with a lantern');
    hut.classList.remove('on'); typed.textContent = '';
    await wait(700);
    for (const ch of text) { typed.textContent += ch; await wait(reduced ? 0 : 75); }
    await wait(350); hut.classList.add('on');
    await wait(4200);
  }
})();

// Weather chips.
const wx = document.getElementById('wx');
document.getElementById('wxchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; wx.dataset.w = b.dataset.w; [...b.parentNode.children].forEach(x => x.classList.toggle('on', x === b)); };

// Dress-up: the hat and the crown share the head, so one replaces the other.
const dressPet = document.querySelector('.dress .pet'), wear = document.getElementById('wear');
wear.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const on = !b.classList.contains('on'), a = b.dataset.a, other = a === 'hat' ? 'crown' : a === 'crown' ? 'hat' : null;
  b.classList.toggle('on', on); dressPet.classList.toggle(a, on);
  if (on && other) { dressPet.classList.remove(other); wear.querySelector(`[data-a=${other}]`).classList.remove('on'); }
};

// ------------------------------------------------------------------------------------------ the desktop demo
// Pets walk on the wallpaper, behind the app windows. The dog wanders; the cat follows the pointer. Windows can be
// dragged aside to find whoever is behind them.
const desk = document.getElementById('desk');
const SAY = { dog: [['멍!', 'Woof!'], ['산책 가자멍!', 'Walk? Walk!'], ['간식 주세요멍', 'Treat, please'], ['여기 좋다멍', 'I like it here']], cat: [['냥.', 'Mew.'], ['흥.', 'Hmph.'], ['쓰다듬어라냥', 'You may pet me'], ['졸리다냥…', 'Sleepy…']] };
const actors = ['dog', 'cat'].map((name, i) => {
  const el = document.createElement('div'); el.className = 'actor';
  el.innerHTML = `<div class="bubble"></div><div class="hopper"><div class="flip">${petSVG(name)}</div></div>`;
  desk.appendChild(el);
  const a = { name, el, svg: el.querySelector('.pet'), flip: el.querySelector('.flip'), hopper: el.querySelector('.hopper'), bubble: el.querySelector('.bubble'), x: i ? 0.62 : 0.3, y: i ? 0.9 : 0.8, tx: i ? 0.62 : 0.3, ty: i ? 0.9 : 0.8, wait: 1 + i, dir: 1 };
  el.style.cursor = 'pointer';
  el.addEventListener('click', () => {
    a.hopper.classList.remove('hop'); void a.hopper.offsetWidth; a.hopper.classList.add('hop');
    const line = SAY[name][Math.floor(Math.random() * 4)]; a.bubble.textContent = T(...line); a.bubble.classList.add('on');
    clearTimeout(a.say); a.say = setTimeout(() => a.bubble.classList.remove('on'), 1600);
  });
  return a;
});
const pointer = { x: 0.5, y: 0.9, inside: false };
desk.addEventListener('pointermove', e => { const r = desk.getBoundingClientRect(); pointer.x = (e.clientX - r.left) / r.width; pointer.y = (e.clientY - r.top) / r.height; pointer.inside = e.pointerType === 'mouse'; });
desk.addEventListener('pointerleave', () => { pointer.inside = false; });
desk.querySelectorAll('.win').forEach(w => {
  let start = null;
  w.addEventListener('pointerdown', e => { start = [e.clientX, e.clientY, w.offsetLeft, w.offsetTop]; w.setPointerCapture(e.pointerId); w.style.right = 'auto'; w.style.left = start[2] + 'px'; w.style.top = start[3] + 'px'; });
  w.addEventListener('pointermove', e => { if (!start) return; w.style.left = start[2] + e.clientX - start[0] + 'px'; w.style.top = start[3] + e.clientY - start[1] + 'px'; });
  w.addEventListener('pointerup', () => { start = null; });
  w.addEventListener('pointercancel', () => { start = null; });
});
let last = performance.now();
function step(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  const W = desk.clientWidth, H = desk.clientHeight;
  for (const a of actors) {
    if (a.name === 'cat' && pointer.inside) { a.tx = Math.min(0.92, Math.max(0.08, pointer.x)); a.ty = Math.min(0.97, Math.max(0.72, pointer.y + 0.12)); a.wait = 0; }
    else if ((a.wait -= dt) < 0 && Math.hypot((a.tx - a.x) * W, (a.ty - a.y) * H) < 8) { a.tx = 0.08 + Math.random() * 0.84; a.ty = 0.72 + Math.random() * 0.25; a.wait = 1.5 + Math.random() * 3.5; }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx * W, dy * H), speed = (a.name === 'cat' ? 0.19 : 0.13) * W;
    const moving = d > 6 && !reduced;
    if (moving) { const k = Math.min(1, speed * dt / d); a.x += dx * k; a.y += dy * k; if (Math.abs(dx) * W > 3) a.dir = Math.sign(dx); }
    a.svg.classList.toggle('walk', moving);
    const s = 0.62 + (a.y - 0.7) * 1.5;
    a.el.style.transform = `translate(${a.x * W - a.el.offsetWidth / 2}px, ${-(1 - a.y) * H}px) scale(${s.toFixed(3)})`;
    a.el.style.zIndex = a.y > 0.86 ? 3 : 2;
    a.flip.style.transform = `scaleX(${a.dir})`;
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// ------------------------------------------------------------------------------------------ hero glow (three.js)
// A slow, soft gradient behind the headline, drawn by one fragment shader. Without WebGL the CSS gradient stays.
try {
  const THREE = await import('three');
  const canvas = document.getElementById('glow'), hero = canvas.parentElement;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const uniforms = { time: { value: 0 }, aspect: { value: 1 }, mouse: { value: new THREE.Vector2(0.5, 0.5) } };
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform float time, aspect; uniform vec2 mouse; varying vec2 vUv;
      vec3 blob(vec3 acc, vec2 p, vec2 c, float r, vec3 col){ float d = length((p - c) * vec2(aspect, 1.0)); return mix(acc, col, smoothstep(r, 0.0, d) * 0.9); }
      void main(){
        vec2 p = vUv; float t = time * 0.12; vec3 c = vec3(1.0, 0.973, 0.933);
        c = blob(c, p, vec2(0.18 + sin(t * 1.3) * 0.1, 0.75 + cos(t) * 0.1), 0.55, vec3(1.0, 0.82, 0.68));
        c = blob(c, p, vec2(0.82 + cos(t * 1.1) * 0.1, 0.8 + sin(t * 0.9) * 0.1), 0.5, vec3(0.74, 0.87, 1.0));
        c = blob(c, p, vec2(0.55 + sin(t * 0.7) * 0.18, 0.3 + cos(t * 1.2) * 0.1), 0.55, vec3(0.86, 0.8, 1.0));
        c = blob(c, p, vec2(0.3 + cos(t * 0.8) * 0.12, 0.25), 0.4, vec3(1.0, 0.9, 0.6));
        c = blob(c, p, mouse, 0.28, vec3(0.72, 0.93, 0.83));
        gl_FragColor = vec4(c, 1.0);
      }`,
  })));
  const size = () => { const w = hero.clientWidth, h = hero.clientHeight; renderer.setPixelRatio(1); renderer.setSize(w / 3, h / 3, false); uniforms.aspect.value = w / h; };
  addEventListener('resize', size); size();
  hero.addEventListener('pointermove', e => { const r = hero.getBoundingClientRect(); uniforms.mouse.value.set((e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height); });
  const draw = ms => { uniforms.time.value = reduced ? 0 : ms / 1000; if (hero.getBoundingClientRect().bottom > 0) renderer.render(scene, cam); requestAnimationFrame(draw); };
  requestAnimationFrame(draw);
} catch { /* the CSS gradient is the fallback */ }
</script>
