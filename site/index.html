<style>

<script type="module">
// --------------------------------------------------------------------------------------------- language
const root = document.documentElement;
function setLang(l) {
  root.lang = l;
  document.querySelectorAll('[data-ko]').forEach(e => { e.innerHTML = e.dataset[l]; });
  document.getElementById('lang').textContent = l === 'ko' ? 'EN' : '한국어';
  document.title = l === 'ko' ? 'PetFam — 우리 펫 가족이 바탕화면에 살아요' : 'PetFam — Your pet family, living on your desktop';
  try { localStorage.setItem('petfam-lang', l); } catch { /* private mode */ }
}
let saved = null; try { saved = localStorage.getItem('petfam-lang'); } catch { /* private mode */ }
setLang(saved ?? ((navigator.language || 'en').startsWith('ko') ? 'ko' : 'en'));
document.getElementById('lang').onclick = () => setLang(root.lang === 'ko' ? 'en' : 'ko');

// --------------------------------------------------------------------------------------------- scene
// One meadow behind the whole page. Scrolling moves through the story: day, a house, rain and snow, more pets,
// sunset, and a starry night. The page still reads fine without WebGL (the body has a sky gradient).
let THREE;
try { THREE = await import('three'); } catch { THREE = null; }
const canvas = document.getElementById('scene');
let renderer = null;
if (THREE) { try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); } catch { renderer = null; } }
if (renderer) start();

function start() {
  const PI = Math.PI;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const range = (t, a, b) => clamp((t - a) / (b - a));
  const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
  const backOut = k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
  function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
  const hemi = new THREE.HemisphereLight('#ffffff', '#9fc27a', 1.2), sun = new THREE.DirectionalLight('#fff3da', 1.5);
  sun.position.set(-4, 7, 6); scene.add(hemi, sun);

  const gradMap = (() => { const t = new THREE.DataTexture(new Uint8Array([165, 255]), 2, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
  const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: gradMap, ...extra });
  const OUT = new THREE.MeshBasicMaterial({ color: '#4b3326', side: THREE.BackSide });
  const SPH = new THREE.SphereGeometry(1, 28, 18), CONE = new THREE.ConeGeometry(1, 1, 16), LEG = new THREE.CapsuleGeometry(0.075, 0.24, 4, 10);
  function add(parent, geo, material, pos, scl, outline = true) {
    const m = new THREE.Mesh(geo, material); m.position.set(...pos); if (scl) m.scale.set(...scl); parent.add(m);
    if (outline) { const o = new THREE.Mesh(geo, OUT); o.scale.setScalar(1.07); m.add(o); }
    return m;
  }

  // Sky dome, sun and moon, stars.
  const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 24, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top, bot; varying vec3 vD; void main(){ float y = normalize(vD).y; gl_FragColor = vec4(mix(bot, top, smoothstep(-0.05, 0.55, y)), 1.0); }',
  }));
  scene.add(sky);
  const disc = (color, r) => new THREE.Mesh(new THREE.CircleGeometry(r, 40), new THREE.MeshBasicMaterial({ color, transparent: true, fog: false }));
  const sunDisc = disc('#fff6d8', 5), moon = disc('#f6f0dc', 4.2); scene.add(sunDisc, moon);
  const starGeo = new THREE.BufferGeometry();
  { const r = rng(5), p = []; for (let i = 0; i < 500; i++) { const a = r() * PI * 2, e = r() * 1.2 + 0.08; p.push(Math.cos(a) * Math.cos(e) * 180, Math.sin(e) * 180, -Math.abs(Math.sin(a) * Math.cos(e)) * 180); } starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); }
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: '#ffffff', size: 1.1, transparent: true, opacity: 0, depthWrite: false })); scene.add(stars);

  // Ground and hills, trees, flowers, clouds.
  const grass = toon('#7cc65a'), far1 = toon('#6bb858'), far2 = toon('#5aa958');
  add(scene, SPH, grass, [0, -80, 0], [80, 80, 80], false);
  add(scene, SPH, far1, [-34, -40, -44], [60, 52, 40], false);
  add(scene, SPH, far2, [40, -44, -60], [70, 58, 40], false);
  const trunkMat = toon('#7a5236'), leafMats = ['#4c9a4a', '#3f8a45', '#5aa850'].map(c => toon(c));
  { const r = rng(9); for (let i = 0; i < 16; i++) { const x = (r() * 2 - 1) * 26, z = -8 - r() * 22, s = 0.9 + r() * 1.3, y = -80 + Math.sqrt(6400 - x * x - z * z);

  { const r = rng(21), p = [], c = [], pal = ['#ffffff', '#ff7aa2', '#ffd166', '#c084fc', '#ff8a5c'].map(x => new THREE.Color(x));
    for (let i = 0; i < 1800; i++) { const x = (r() * 2 - 1) * 16, z = 5 - r() * 20, y = -80 + Math.sqrt(6400 - x * x - z * z) + 0.06; p.push(x, y, z); const k = pal[Math.floor(r() * 5)]; c.push(k.r, k.g, k.b); }

  // Pets.
  function makePet(o) {

    const body = p.body = new THREE.Group(); rootG.add(body);

      const hl = new THREE.Mesh(SPH, white); hl.position.set(0.3, 0.38, 0.82); hl.scale.setScalar(0.32); eye.add(hl); p.eyes.push(eye);

  const dog = makePet({ kind: 'dog', coat: '#e7b36e', belly: '#fff1dc', ear: '#c98c4b', seed: 1, x: -0.9 });
  const cat = makePet({ kind: 'cat', coat: '#8f9aab', belly: '#f4f1ec', seed: 2, x: 0.9 });

    makePet({ kind: 'dog', coat: '#7d8696', belly: '#f4f6fa', ears: 'up', mask: true, seed: 5, x: 0.05, z: -1.0 }),
    makePet({ kind: 'cat', coat: '#3c3c48', belly: '#55556a', seed: 6, x: 1.85, z: -0.7 }),
    makePet({ kind: 'cat', coat: '#f2a65a', belly: '#fff1df', seed: 3, x: 2.6, z: 0.1 }),
  ];
  const pets = [dog, cat, ...extras];

  // House with a lantern.
  const house = new THREE.Group(); house.position.set(0.2, 0, -2.6); house.rotation.y = 0.35; scene.add(house);
  const roofMat = toon('#c8553e'), winMat = new THREE.MeshBasicMaterial({ color: '#8a7a5a' }), bulbMat = new THREE.MeshBasicMaterial({ color: '#9a958a' });

    add(house, new THREE.BoxGeometry(2.4, 1.5, 1.7), toon('#b07a45'), [0, 0.75, 0]);
    const tri = new THREE.Shape(); tri.moveTo(-1.5, 0); tri.lineTo(1.5, 0); tri.lineTo(0, 1.15); tri.lineTo(-1.5, 0);
    const g = new THREE.ExtrudeGeometry(tri, { depth: 2.0, bevelEnabled: false }); g.translate(0, 0, -1.0);
    add(house, g, roofMat, [0, 1.5, 0]);
    add(house, new THREE.BoxGeometry(0.55, 0.95, 0.06), toon('#6b3f22'), [0.5, 0.47, 0.86], null, false);
    add(house, new THREE.BoxGeometry(0.55, 0.48, 0.06), winMat, [-0.5, 0.9, 0.86], null, false);
    add(house, new THREE.CylinderGeometry(0.04, 0.05, 1.5, 8), toon('#3d3a40'), [1.6, 0.75, 0.9], null, false);
    add(house, SPH, bulbMat, [1.6, 1.58, 0.9], [0.12, 0.14, 0.12], false);
  }
  const lamp = new THREE.PointLight('#ffc978', 0, 9, 1.5); lamp.position.set(1.6, 1.6, 1.2); house.add(lamp);

  // Rain, snow, fireflies.
  const N = 700, rainPos = new Float32Array(N * 6), rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
  const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: '#dceaff', transparent: true, opacity: 0 })); rain.frustumCulled = false; scene.add(rain);
  const dots = (n, color, size, additive) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    const m = new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending })); m.frustumCulled = false; scene.add(m); return m; };
  const snow = dots(500, '#ffffff', 0.09, false), flies = dots(90, '#ffe27a', 0.13, true);
  snow.material.map = flies.material.map = dotTex;

  // Story keys along the scroll: [section, sky top, sky bottom, light, ground tint].
  const KEYS = [
    [0, '#3f8fe0', '#d9f0f4', 1.0, '#ffffff'], [3.3, '#3f8fe0', '#d9f0f4', 1.0, '#ffffff'], [4.0, '#5d6f8f', '#aeb9c8', 0.6, '#a9b6c4'],
    [4.7, '#8fa3c0', '#dfe6ee', 0.8, '#eef3f8'], [5.3, '#4a8fdc', '#f6e2c0', 1.0, '#fff3dc'], [6.2, '#5a5fb0', '#ffb38a', 0.8, '#ffc9a0'], [7.0, '#070b24', '#1c2c66', 0.3, '#5a6aa8'],
  ].map(k => [k[0], new THREE.Color(k[1]), new THREE.Color(k[2]), k[3], new THREE.Color(k[4])]);
  const SIDE = [0, 1, -1, 1, -1, 1, 0, 0];
  const tint = new THREE.Color();

  const sections = [...document.querySelectorAll('main section')];
  function progress() {
    const mid = scrollY + innerHeight / 2; let s = 0;
    sections.forEach((el, i) => { const top = el.offsetTop, h = el.offsetHeight; if (mid >= top + h / 2) s = Math.min(sections.length - 1, i + clamp((mid - top - h / 2) / h)); });

  }

  // Pointer.

  addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = -(e.clientY / innerHeight * 2 - 1); ptr.seen = true; });
  const fx = document.getElementById('fx'), v3 = new THREE.Vector3();

  let now = 0;
  addEventListener('pointerdown', e => {
    if (e.target.closest('a, button, video, .card')) return;
    let best = null, bd = 1e9;
    for (const p of pets) { if (p.root.scale.x < 0.5) continue; const [sx, sy] = toScreen(p.x, 0.7, p.root.position.z); const d = Math.hypot(sx - e.clientX, sy - e.clientY); if (d < bd) { bd = d; best = p; } }

  // Speech bubbles for the AI section.

    [['여기 풀밭 정말 좋다멍!', '흥, 나쁘지 않다냥.'], ['I love this meadow!', 'Hmph. Not bad.']],
    [['저 연못에 뛰어들까멍?', '젖는 건 질색이다냥.'], ['Shall we jump in the pond?', 'I do not do wet.']],
    [['집사 오늘 일 많다멍.', '그러게, 간식이나 달라냥.'], ['Our human is busy today.', 'Then where are my treats?']],
  ];
  const bubbles = [dog, cat].map(() => { const d = document.createElement('div'); d.className = 'bubble'; fx.appendChild(d); return d; });

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

  let last = performance.now(), camX = 0;

    for (let i = 1; i < KEYS.length; i++) { if (s <= KEYS[i][0]) { a = KEYS[i - 1]; b = KEYS[i]; break; } a = b = KEYS[i]; }
    const k = a === b ? 0 : smooth(range(s, a[0], b[0])), light = lerp(a[3], b[3], k);
    sky.material.uniforms.top.value.lerpColors(a[1], b[1], k); sky.material.uniforms.bot.value.lerpColors(a[2], b[2], k);
    tint.lerpColors(a[4], b[4], k);
    hemi.intensity = 1.25 * light + 0.15; sun.intensity = 1.6 * light; hemi.color.copy(tint); sun.color.copy(tint);
    const night = smooth(range(s, 6.3, 7)), rainy = smooth(range(s, 3.5, 3.9)) * (1 - smooth(range(s, 4.25, 4.55))), snowy = smooth(range(s, 4.3, 4.6)) * (1 - smooth(range(s, 5.0, 5.3)));

    cloudMat.color.setRGB(lerp(1, 0.6, rainy) * lerp(1, 0.35, night), lerp(1, 0.64, rainy) * lerp(1, 0.4, night), lerp(1, 0.74, rainy) * lerp(1, 0.6, night));

    roofMat.color.set('#c8553e').lerp(tint.set('#f3f7ff'), 0.85 * smooth(range(s, 4.45, 4.9)) * (1 - smooth(range(s, 5.1, 5.5))));
    const lit = Math.max(night, rainy * 0.8, smooth(range(s, 5.6, 6.3)));
    lamp.intensity = lit * 14; bulbMat.color.set(lit > 0.3 ? '#ffe9a8' : '#9a958a'); winMat.color.set(lit > 0.3 ? '#ffe39a' : '#8a7a5a');

    // Pets: the cat follows the pointer, everyone looks at it, extras join for the breeds section.

    const target = ptr.seen && s < 5 ? clamp(wx, 0.3, 1.7) : 0.9;
    pets.forEach((p, i) => {
      const isCat = p === cat, isExtra = i >= 2;
      let walking = 0;
      if (isCat) { const d = target - p.x; if (Math.abs(d) > 0.08) { p.x += Math.sign(d) * Math.min(Math.abs(d), 1.5 * dt); walking = Math.sign(d); } }
      p.sit = lerp(p.sit, walking ? 0 : 1, 1 - Math.exp(-dt * 8)); p.face = lerp(p.face, walking * 1.15, 1 - Math.exp(-dt * 8));
      const pop = isExtra ? backOut(range(s, 4.75 + (i - 2) * 0.07, 5.1 + (i - 2) * 0.07)) : 1;
      const hk = (t - p.hop) / 0.5, hop = hk > 0 && hk < 1 ? 4 * 0.45 * hk * (1 - hk) : 0;
      const gy = -80 + Math.sqrt(6400 - p.x * p.x);
      p.root.position.set(p.x, gy + hop, p.o.z ?? 0.3); p.root.scale.setScalar(Math.max(0.001, pop) * (isExtra ? 0.92 : 1)); p.root.visible = pop > 0.01; p.root.rotation.y = p.face;
      const [sx, sy] = toScreen(p.x, 0.9, 0.3), lx = ptr.seen ? (ptr.x - (sx / innerWidth * 2 - 1)) : 0, ly = ptr.seen ? (ptr.y + (sy / innerHeight * 2 - 1)) : 0;
      const sit = p.sit, wk = Math.sin(t * 11) * 0.7 * (1 - sit);
      p.hips[0].rotation.x = wk + 0.5 * sit; p.hips[1].rotation.x = -wk + 0.5 * sit; p.hips[2].rotation.x = -wk - 1.1 * sit; p.hips[3].rotation.x = wk - 1.1 * sit;

      p.tail.rotation.y = Math.sin(t * (p.o.kind === 'cat' ? 2.2 : 9 + 6 * Math.max(near, p.wagBoost)) + p.seed) * (p.o.kind === 'cat' ? 0.3 : 0.5 + 0.3 * near);
      const blink = ((t * 0.27 + p.seed * 0.37) % 1) < 0.035 || (hk > 0 && hk < 1.6);

    });

    if (snowy > 0.01) { const r = rng(77), p = snow.geometry.attributes.position; for (let i = 0; i < 500; i++) { const sp = 0.7 + r() * 0.8, ph = r() * 6; p.setXYZ(i, camX + (r() - 0.5) * 22 + Math.sin(t * 1.2 + ph) * 0.25, 9 - ((t * sp + r() * 11) % 11), 4 - r() * 14); } p.needsUpdate = true; }
    if (night > 0.01) { const r = rng(61), p = flies.geometry.attributes.position; for (let i = 0; i < 90; i++) { const ph = r() * 6.3, sp = 0.5 + r(); p.setXYZ(i, camX + (r() - 0.5) * 16 + Math.sin(t * 0.5 * sp + ph) * 0.8, 0.4 + r() * 3 + Math.sin(t * 0.8 * sp + ph) * 0.4, 2 - r() * 8); } p.needsUpdate = true; }

      const on = talk > 0.3 && turn % 2 === i, el = bubbles[i];

      p.head.getWorldPosition(v3); const [sx, sy] = toScreen(v3.x, v3.y + 0.5, v3.z);
      el.style.left = sx + 'px'; el.style.top = sy + 'px'; el.style.opacity = on ? 1 : 0;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
