<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
// ======== 00_util.js ========
// ---- small maths, noise and sculpting helpers shared by everything -------------------------------------------------
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ease = k => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const backOut = k => { k = clamp(k); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const bell = (t, a, b, f = 0.15) => smooth(range(t, a, a + f)) * (1 - smooth(range(t, b - f, b)));
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// Value noise in 2 and 3 dimensions, and fbm.
const PERM = (() => { const r = rng(1234), p = new Float32Array(4096); for (let i = 0; i < 4096; i++) p[i] = r(); return p; })();
const h3 = (x, y, z) => PERM[(x * 73856093 ^ y * 19349663 ^ z * 83492791) & 4095];
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z); let fx = x - xi, fy = y - yi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = lerp(lerp(h3(xi, yi, zi), h3(xi + 1, yi, zi), fx), lerp(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), fx), fy);
  const b = lerp(lerp(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), fx), lerp(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), fx), fy);
  return lerp(a, b, fz);
}
const noise2 = (x, y) => noise3(x, y, 7.31);
function fbm2(x, y, oct = 4) { let v = 0, a = 0.5, n = 0; for (let i = 0; i < oct; i++) { v += a * noise2(x, y); n += a; x = x * 2.03 + 11.7; y = y * 2.03 + 3.1; a *= 0.5; } return v / n; }
function fbm3(x, y, z, oct = 4) { let v = 0, a = 0.5, n = 0; for (let i = 0; i < oct; i++) { v += a * noise3(x, y, z); n += a; x = x * 2.03 + 11.7; y = y * 2.03 + 3.1; z = z * 2.03 + 5.9; a *= 0.5; } return v / n; }

// The same noise for shaders.
const GLSL_NOISE = `
  float hash11(float n){ return fract(sin(n) * 43758.5453123); }
  float hash31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
  float vnoise(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash31(i), hash31(i + vec3(1,0,0)), f.x), mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x), mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.03 + 7.1; a *= 0.5; } return v / 0.9375; }`;

// ---- signed distance sculpting -------------------------------------------------------------------------------------
// Shapes are written as distance functions and blended smoothly; sculpt() turns one into a mesh by walking outward from
// a centre along every direction of a sphere (so the shape must be visible from that centre, which limbs and heads are).
const smin = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k); return lerp(b, a, h) - k * h * (1 - h); };
const sdSphere = (x, y, z, cx, cy, cz, r) => Math.hypot(x - cx, y - cy, z - cz) - r;
function sdEllipsoid(x, y, z, cx, cy, cz, rx, ry, rz) {
  const px = (x - cx) / rx, py = (y - cy) / ry, pz = (z - cz) / rz, k0 = Math.hypot(px, py, pz);
  if (k0 < 1e-6) return -Math.min(rx, ry, rz);
  const k1 = Math.hypot(px / rx, py / ry, pz / rz);
  return k0 * (k0 - 1) / k1;
}
function sdCapsule(x, y, z, ax, ay, az, bx, by, bz, ra, rb = ra) {
  const pax = x - ax, pay = y - ay, paz = z - az, bax = bx - ax, bay = by - ay, baz = bz - az;
  const h = clamp((pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz));
  return Math.hypot(pax - bax * h, pay - bay * h, paz - baz * h) - lerp(ra, rb, h);
}
// sdf(x, y, z) -> distance. paint(p, n, out) fills out.color (THREE.Color) and returns the fur length factor 0..1.
function sculpt(sdf, { center = [0, 0, 0], rmax = 1, seg = 56, rings = 40, paint = null, deform = null } = {}) {
  const geo = new THREE.SphereGeometry(1, seg, rings), pos = geo.attributes.position, nor = geo.attributes.normal;
  const col = new Float32Array(pos.count * 3), fur = new Float32Array(pos.count), c = new THREE.Color(), p = new THREE.Vector3(), n = new THREE.Vector3();
  const [cx, cy, cz] = center, e = 0.004;
  for (let i = 0; i < pos.count; i++) {
    const dx = pos.getX(i), dy = pos.getY(i), dz = pos.getZ(i);
    let lo = 0, hi = rmax;
    for (let k = 0; k < 22; k++) { const m = (lo + hi) / 2; if (sdf(cx + dx * m, cy + dy * m, cz + dz * m) < 0) lo = m; else hi = m; }
    const x = cx + dx * lo, y = cy + dy * lo, z = cz + dz * lo;
    n.set(sdf(x + e, y, z) - sdf(x - e, y, z), sdf(x, y + e, z) - sdf(x, y - e, z), sdf(x, y, z + e) - sdf(x, y, z - e)).normalize();
    p.set(x, y, z);
    c.setRGB(1, 1, 1); fur[i] = paint ? paint(p, n, c) : 1;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    if (deform) deform(p, n);
    pos.setXYZ(i, p.x, p.y, p.z); nor.setXYZ(i, n.x, n.y, n.z);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.setAttribute('aFur', new THREE.BufferAttribute(fur, 1));
  if (deform) geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return geo;
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ======== 05_quality.js ========
// ---- how much detail this device gets -----------------------------------------------------------------------------
const QS = new URLSearchParams(location.search);
const MOBILE = matchMedia('(max-width: 760px)').matches || (navigator.hardwareConcurrency ?? 8) <= 4;
const QUALITY = MOBILE ? { msaa: 2, shells: 12, grass: 48000, leaves: 0.5, px: Math.min(devicePixelRatio, 1.5), shadow: 2048 }
  : { msaa: 4, shells: 22, grass: 90000, leaves: 1, px: Math.min(devicePixelRatio, 2), shadow: 4096 };

// ======== 10_core.js ========
// ---- renderer, sky, light and the lens: one "weather of the moment" that every material reads -----------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;          // the lens pass below does exposure, tone curve and encoding
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 900);
const U = { time: { value: 0 }, wind: { value: new THREE.Vector2(1, 0.3) }, snow: { value: 0 }, wet: { value: 0 } };   // shared by all materials

// The state of the day. Story keys (70_story.js) blend these; applyEnv() pushes one to the sky, the lights and the fog.

    if (jump < 1) { d.x = lerp(2.5, px - 0.6, jump); d.z = lerp(1.45, pz, jump); d.y = lerp(groundY(2.5, 1.45), ISLE.water - 0.5, jump) + Math.sin(jump * PI) * 1.5; d.yaw = 1.5; d.air = Math.sin(jump * PI); d.pitch = lerp(-0.5, 0.6, jump); d.gait = 0; }
    else { const k = smooth(out2); d.x = lerp(sx, 2.5, k); d.z = lerp(sz, 1.45, k); d.y = lerp(ISLE.water - 0.62, groundY(2.5, 1.45), k); d.yaw = k > 0.05 ? -1.5 : sw + PI / 2 + PI / 2; d.gait = 1; d.phase = t * 11; d.pitch = -0.12; out.wake = { x: d.x, z: d.z, k: 1 - k }; }
    out.splash.push({ age: (s - 2.0) * 3.2, x: px - 0.6, y: ISLE.water, z: pz, power: 1.15 });
  }
  out.wet = bell(s, 2.0, 3.25, 0.03); d.roll = Math.sin(t * 34) * 0.16 * bell(s, 2.78, 2.98, 0.04);
  if (s > 4.8 && s < 5.25) { const h = Math.abs(Math.sin(t * 5)); d.y += h * 0.5; d.air = h * 0.6; d.sit = 0; d.happy = true; if (h < 0.15) out.splash.push({ age: ((t * 5 / PI) % 1) * 0.6, x: d.x, y: d.y, z: d.z, power: 0.35 }); }
  if (s > 5.3 && s < 5.72) d.look = [0, 0.45];
  if (s > 6.85) d.happy = true;
  d.look ??= lookAt(d, d.y + 1.2);
  // ---- cat
  let c = catTrack(s);
  c.y = groundY(c.x, c.z); c.wag = 0.4;
  if (s < 2.6) { c.y = groundY(RX, RZ) + 0.86; c.lie = smooth(range(s, 1.5, 1.9)); c.sit = 1 - c.lie; c.happy = c.lie > 0.6; }
  else if (s < 3.0) c.y += (1 - smooth(range(s, 2.6, 2.75))) * 0.86;
  const inside = bell(s, 4.9, 5.7, 0.03); c.scale = 1 - inside; c.hide = inside > 0.98;
  if (s > 6.85) c.happy = true;
  c.look ??= lookAt(c, c.y + 1.0);
  if (s > 2.9 && s < 3.6) { d.look = [0.25, 0.05]; c.look = [-0.25, 0.0]; d.tilt = Math.sin(t * 1.3) * 0.18; }
  // ---- the rest of the family, for the golden hour
  out.extras = EXTRA_SPOTS.map(([x, z, yaw], i) => { const k = backOut(range(s, 5.74 + i * 0.04, 5.9 + i * 0.04)) * (1 - smooth(range(s, 6.6 + i * 0.03, 6.75 + i * 0.03)));
    const st = { x, z, y: groundY(x, z), yaw, sit: 1, scale: Math.max(0.001, k), hide: k < 0.01, wag: 0.7 }; st.look = lookAt(st, st.y + 1.1); return st; });
  if (click) { const a = t - click.t0, st = click.pet === 'dog' ? d : click.pet === 'cat' ? c : out.extras[click.pet]; if (st && a > 0 && a < 0.55) { st.y += Math.sin(a / 0.55 * PI) * 0.7; st.happy = true; st.air = Math.sin(a / 0.55 * PI) * 0.5; } }
  out.dog = d; out.cat = c;
  return out;
}

// ======== 90_main.js ========
// ---- boot, input, the frame ---------------------------------------------------------------------------------------------
const dog = makePet(SPECS.dog), cat = makePet(SPECS.cat);
const extras = [
  makePet(variant('dog', { coat: C('#f4f1ea'), cream: C('#ffffff'), dark: C('#d9d2c4'), ear: C('#e6dfd2'), scale: 1.25 })),
  makePet(variant('cat', { coat: C('#e8964a'), cream: C('#fff3e2'), dark: C('#b9692a'), ear: C('#d9843c'), iris: C('#e2b23a'), scale: 1.2 })),
  makePet(variant('cat', { coat: C('#3d3d4a'), cream: C('#4a4a58'), dark: C('#2c2c36'), ear: C('#34343f'), iris: C('#ffd23f'), stripes: false, scale: 1.25 })),
  makePet(variant('dog', { coat: C('#6f7888'), cream: C('#f1f3f7'), dark: C('#4c5462'), ear: C('#59616f'), scale: 1.45 })),
];
for (const p of [dog, cat, ...extras]) { scene.add(p.root); p.fur = []; p.root.traverse(o => { if (o.material?.userData?.U) p.fur.push(o.material.userData.U); }); }
const setWet = (p, v) => { for (const u of p.fur) u.wet.value = v; };

// ---- language and the words on screen
const root = document.documentElement;
function setLang(l) {
  root.lang = l;
  document.querySelectorAll('[data-ko]').forEach(e => { e.innerHTML = e.dataset[l]; });
  document.getElementById('lang').textContent = l === 'ko' ? 'EN' : '한국어';
  document.title = l === 'ko' ? 'PetFam — 우리 펫 가족이 바탕화면에 살아요' : 'PetFam — Your pet family, living on your desktop';
  try { localStorage.setItem('petfam-lang', l); } catch { /* private mode */ }
}
document.getElementById('lang').onclick = () => setLang(root.lang === 'ko' ? 'en' : 'ko');
{ let saved = null; try { saved = localStorage.getItem('petfam-lang'); } catch { /* private mode */ } setLang(QS.get('lang') ?? saved ?? ((navigator.language || 'en').startsWith('ko') ? 'ko' : 'en')); }
const beatEls = [...document.querySelectorAll('.beat')], dotsEl = document.getElementById('dots'), bubbles = [...document.querySelectorAll('.bubble')];
dotsEl.innerHTML = beatEls.map(() => '<i></i>').join('');
// [dog says, cat answers] in Korean and English.
const TALK = [
  { ko: ['여기 풀밭 진짜 좋다멍!', '흥, 나쁘지 않다냥.'], en: ['I love this meadow!', 'Hmph. Not bad.'] },
  { ko: ['같이 연못 들어가자멍!', '젖는 건 질색이다냥.'], en: ['Come swim with me!', 'I do not do wet.'] },
  { ko: ['집사 오늘 일 많아 보인다멍.', '그럼 간식은 누가 주냥…'], en: ['Our human looks busy today.', 'Then who brings the treats…'] },
];
const _v = new THREE.Vector3();
function updateDom(s, t) {
  const portrait = innerWidth < 760;
  beatEls.forEach((el, i) => {
    const a = clamp(1 - Math.abs(s - i) * (i === 0 || i === BEATS - 1 ? 2.2 : 2.6)), e = smooth(a), center = el.classList.contains('center');
    el.style.opacity = e.toFixed(3); el.style.visibility = e > 0.01 ? 'visible' : 'hidden';
    el.style.transform = `${center ? 'translateX(-50%) ' : ''}${!center && !portrait ? 'translateY(-50%) ' : ''}translateY(${((s - i) * -70).toFixed(1)}px)`;
    dotsEl.children[i].classList.toggle('on', Math.round(s) === i);
  });
  const talk = Math.abs(s - 3) < 0.3, turn = Math.floor(t / 2.8), pair = TALK[Math.floor(turn / 2) % TALK.length][root.lang === 'ko' ? 'ko' : 'en'];
  [dog, cat].forEach((p, i) => {
    const el = bubbles[i], on = talk && turn % 2 === i;
    if (on && el.textContent !== pair[i]) el.textContent = pair[i];
    p.head.getWorldPosition(_v); _v.y += 0.62; _v.project(camera);
    el.style.left = `${(_v.x * 0.5 + 0.5) * innerWidth}px`; el.style.top = `${(-_v.y * 0.5 + 0.5) * innerHeight}px`; el.classList.toggle('on', on);
  });
}

// ---- input: scroll position (eased), pointer, clicks on pets
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ptr = { x: 0, y: 0, seen: false }, ptrWorld = new THREE.Vector3(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.9), noPtr = { x: 0, y: 0 };
addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = -(e.clientY / innerHeight * 2 - 1); ptr.seen = e.pointerType === 'mouse'; });
let click = null, lastStates = null, clockNow = 0; const hearts = [];
addEventListener('pointerdown', e => {
  if (e.target.closest('a, button') || !lastStates) return;
  let best = null, bd = 130;
  for (const [id, st] of [['dog', lastStates.dog], ['cat', lastStates.cat], ...lastStates.extras.map((x, i) => [i, x])]) {
    if (st.hide) continue; _v.set(st.x, st.y + 0.8, st.z).project(camera);
    const d = Math.hypot((_v.x * 0.5 + 0.5) * innerWidth - e.clientX, (-_v.y * 0.5 + 0.5) * innerHeight - e.clientY); if (d < bd) { bd = d; best = [id, st]; }
  }
  if (best) { click = { pet: best[0], t0: clockNow }; hearts.push({ t0: clockNow, x: best[1].x, y: best[1].y + 1.6, z: best[1].z }); if (hearts.length > 3) hearts.shift(); }
});
const scrollP = () => { const max = document.documentElement.scrollHeight - innerHeight; return max > 0 ? clamp(scrollY / max) : 0; };
let sSmooth = scrollP() * (BEATS - 1);

function resize() {
  const w = innerWidth, h = innerHeight, px = QUALITY.px;
  renderer.setPixelRatio(px); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  buildLens(Math.round(w * px), Math.round(h * px)); lensU.res.value.set(w * px, h * px);
}
addEventListener('resize', resize); resize();

// One frame: story position s (0..7) and time t in seconds decide everything.
function frame(s, t) {
  clockNow = t; U.time.value = t;
  envAt(s); applyEnv();
  cameraAt(s, t, ptr.seen && !reduced ? ptr : noPtr);
  if (ptr.seen) { ray.setFromCamera(new THREE.Vector2(ptr.x, ptr.y), camera); if (!ray.ray.intersectPlane(plane, ptrWorld)) ptrWorld.set(0, 1, 6); }
  const rain = bell(s, 4.7, 5.3, 0.12), snow = bell(s, 5.25, 5.82, 0.12), night = env.night;
  const st = lastStates = petsAt(s, t, ptr.seen ? ptrWorld : null, click);
  dog.update(st.dog, t); setWet(dog, Math.max(st.wet, rain * 0.6));
  cat.root.visible = !st.cat.hide; cat.update(st.cat, t);
  extras.forEach((p, i) => { p.root.visible = !st.extras[i].hide; if (p.root.visible) p.update(st.extras[i], t); });
  U.wet.value = rain * 0.9; U.snow.value = smooth(range(s, 5.3, 5.6)) * (1 - smooth(range(s, 5.68, 5.9)));
  buildCabin(range(s, 3.3, 3.98));
  showWindows(bell(s, 0.55, 1.75, 0.3), t);
  const lit = s > 4.25 ? Math.max(night, rain * 0.8, snow * 0.5, smooth(range(s, 6.0, 6.4)) * 0.6) : 0;
  cabinLit.glass.emissiveIntensity = lit * 2.2; cabinLit.bulb.emissiveIntensity = 0.2 + lit * 5; cabinLit.light.intensity = lit * 26;
  ball.position.set(-3.1, groundY(-3.1, 3.2) + 0.2, 3.2);
  updateFx({ rain, snow, night, splash: st.splash, wake: st.wake, smoke: s > 4.0 ? 1 - 0.75 * night : 0, hearts }, t);
  if (waterMat.userData.rip) waterMat.userData.rip.value.set(ISLE.pond[0] - 0.6, ISLE.pond[1], s > 2.0 && s < 3.4 ? t - (s - 2.0) * 3.2 : -99, 0);
  lensU.tilt.value = MOBILE ? 0 : 0.5 * (1 - bell(s, 2.6, 3.4, 0.3) * 0.6);
  const cu = cloudSea.material.uniforms; cu.fogCol.value.copy(scene.fog.color); cu.col.value.setRGB(...env.cloudCol).multiplyScalar(lerp(1, 0.25, night)); cu.shade.value.setRGB(...env.hor).multiplyScalar(lerp(0.85, 0.3, night));
  aimSun(0, 0, 0); updateClouds(t);
  updateDom(s, t);
  composer.render();
}
window.__frame = (p, t) => frame(p * (BEATS - 1), t);

// Warm up every shader on a hidden frame, then lift the curtain.
window.__ready = new Promise(res => requestAnimationFrame(() => { frame(sSmooth, 0); frame(5, 0); frame(sSmooth, 0); document.getElementById('loader').classList.add('done'); res(true); }));
if (!QS.has('capture')) {
  let last = performance.now();
  const loop = ms => {
    const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
    sSmooth = lerp(sSmooth, scrollP() * (BEATS - 1), 1 - Math.exp(-dt * (reduced ? 30 : 4.5)));
    if (!document.hidden) frame(sSmooth, ms / 1000);
    requestAnimationFrame(loop);
  };
  window.__ready.then(() => requestAnimationFrame(loop));
}
